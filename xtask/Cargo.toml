[package]
name = "xtask"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Workspace developer tooling: cargo xtask seam-probe / string-edge."

[dependencies]
# FR-059's `graph::classify` (ecosystem packages, ADR-032 DT-4).
arch-lint = { path = "../tools/arch-lint" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
# FR-340: the refinement gate runs cases through `fsl_replay::spine::run_clause`
# and reads its inputs as FR-106 observation documents.
fsl-foundation = { path = "../fsl-foundation" }
fsl-analyze = { path = "../fsl-analyze" }
fsl-conformance = { path = "../fsl-conformance" }
# FR-567-AC-5: the report names this package's own `CARGO_PKG_VERSION`.
filament-spec-language = { path = ".." }
filament-specification-qualification = { workspace = true }
fsl-cst = { path = "../fsl-cst" }
logos = "0.16.1"
fsl-route = { path = "../fsl-route" }
fsl-replay = { path = "../fsl-replay" }
fsl-command = { path = "../fsl-command" }
fsl-semantics = { path = "../fsl-semantics" }
filament-exact = { workspace = true }
quire-canonical = { workspace = true, features = ["serde_json"] }
filament-semantic-value = { workspace = true }
# FR-064: `xtask string-edge` calls the one standalone scanner with FSL's roots.
fsl-string-edge = { path = "../fsl-string-edge" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "2.0.119", features = ["full", "visit"] }
thiserror = "2.0.20"
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
serde_json_canonicalizer = "0.3.2"

[features]
# FR-567: a test may replace the matrix cell set; the command line cannot.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"

# FR-765-AC-3: needs the sibling driver and examples checkouts; run by
# `make examples-check` after the gate itself.
[[test]]
name = "examples_check"
path = "tests/examples_check.rs"
test = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
