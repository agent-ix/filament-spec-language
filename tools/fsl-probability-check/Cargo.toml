[package]
name = "fsl-probability-check"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Source-backed exact probability certificate checker executable"

[dependencies]
fsl-replay = { path = "../../fsl-replay" }
fsl-foundation = { path = "../../fsl-foundation" }
fsl-semantics = { path = "../../fsl-semantics" }
fsl-eval = { path = "../../fsl-eval" }
filament-checked = { workspace = true }
filament-exact = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[dev-dependencies]
base64 = "0.22"
fsl-analyze = { path = "../../fsl-analyze" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[[test]]
name = "it"
path = "tests/it/main.rs"
