[package]
name = "fsl-conformance"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "FR-564, FR-565 (ADR-029 CB-4): the lifecycle conformance matrix the library half and the driver CLI half both run."

# The matrix runs FSL's lifecycle operations (`fsl-replay`'s spine, `fsl-analyze`'s
# `analyze`, `monitor` and provider entry), so it depends on the layers those
# name and on nothing else; the driver depends on this crate, never the reverse.
[dependencies]
fsl-analyze = { path = "../fsl-analyze" }
fsl-eval = { path = "../fsl-eval" }
fsl-foundation = { path = "../fsl-foundation" }
fsl-route = { path = "../fsl-route" }
fsl-package = { path = "../fsl-package" }
fsl-replay = { path = "../fsl-replay" }
fsl-semantics = { path = "../fsl-semantics" }
filament-checked = { workspace = true }
filament-eval = { workspace = true }
filament-exact = { workspace = true }
filament-semantic-value = { workspace = true }
thiserror = "2.0.20"

[dev-dependencies]
fsl-command = { path = "../fsl-command" }
serde_json = "1.0.151"
jsonschema = { version = "0.17.1", default-features = false, features = ["draft202012"] }
tempfile = "3.27.0"
fsl-cst = { path = "../fsl-cst" }
fsl-forms = { path = "../fsl-forms" }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
fsl-analyze = { path = "../fsl-analyze", features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
