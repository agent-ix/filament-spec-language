[package]
name = "fsl-certificate-mutation"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Shared single-mutation harness for FSL certificate checker tests"

[dependencies]
base64 = "0.22"
quire-canonical = { workspace = true, features = ["serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth", "raw_value"] }
thiserror = "2.0.20"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

