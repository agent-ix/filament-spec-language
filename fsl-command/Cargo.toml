[package]
name = "fsl-command"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
description = "Non-core bounded request-file intake and typed command orchestration"

[features]
default = []
quire-extraction = ["dep:fsl-source", "fsl-replay/quire-extraction"]

[dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
fsl-foundation = { path = "../fsl-foundation" }
fsl-cst = { path = "../fsl-cst" }
fsl-replay = { path = "../fsl-replay" }
fsl-eval = { path = "../fsl-eval" }
filament-eval = { workspace = true }
fsl-semantics = { path = "../fsl-semantics" }
fsl-analyze = { path = "../fsl-analyze" }
fsl-inspect = { path = "../fsl-inspect" }
fsl-route = { path = "../fsl-route" }
fsl-forms = { path = "../fsl-forms" }
fsl-package = { path = "../fsl-package" }
fsl-source = { path = "../fsl-source", optional = true, features = ["quire-extraction"] }
filament-contract-model = { workspace = true }
filament-exact = { workspace = true }
filament-semantic-value = { workspace = true }
# FR-862: the replay request reader converts a witness value to its owner's
# canonical wire bytes, and reads a request tree with no nesting ceiling.
quire-canonical = { workspace = true, features = ["serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "unbounded_depth"] }
thiserror = "2.0.20"
# ADR-011, FR-931: the temporal correspondence stage is this crate's
# only; no other FSL crate names the TL crates. Both dependencies use the
# `tl-syntax` v0.4.0 tag, so they name one `Formula` type.
tl-mltl = { git = "https://github.com/agent-ix/tl-mltl", tag = "v0.4.1" }
tl-syntax = { git = "https://github.com/agent-ix/tl-syntax.git", tag = "v0.4.0", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
filament-checked = { workspace = true, features = ["test-support"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
